<!DOCTYPE html>
<html lang="pt-BR" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VoiceKar - Seu Karaoke & Vídeos</title>
    
    <!-- Favicon: Ícone de Microfone Lilás Escuro na Aba do Navegador -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%235E3A8C'><path d='M12 14a3 3 0 0 0 3-3V5a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3zm5-3a1 1 0 0 0-2 0 3 3 0 0 1-6 0 1 1 0 0 0-2 0 5 5 0 0 0 4 4.9V19H9a1 1 0 1 0 0 2h6a1 1 0 1 0 0-2h-2v-3.1A5 5 0 0 0 17 11z'/></svg>">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        pastel: {
                            bg: '#F7F4EF',
                            card: '#FFFFFF',
                            header: '#E8DFF5',
                            primary: '#B5C99A',
                            primaryHover: '#97AF7B',
                            secondary: '#FFC8DD',
                            accent: '#A2D2FF',
                            text: '#4A4E69',
                            border: '#D3C5E5',
                            grayBorder: '#9CA3AF',
                            greenBorder: '#10B981'
                        },
                        darkpastel: {
                            bg: '#1D2A44',
                            card: '#24344D',
                            header: '#2D2438',
                            primary: '#6B8E78',
                            primaryHover: '#52735E',
                            secondary: '#B57A95',
                            accent: '#5E81AC',
                            text: '#E5E9F0',
                            border: '#443852',
                            grayBorder: '#6B7280',
                            greenBorder: '#34D399'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            box-sizing: border-box;
        }
        body {
            transition: background-color 0.3s ease, color 0.3s ease;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
        }
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(156, 163, 175, 0.4);
            border-radius: 9999px;
        }
        .right-border-original {
            border-right: 5px solid #10B981 !important;
        }
        .dark .right-border-original {
            border-right: 5px solid #34D399 !important;
        }
        .right-border-standard {
            border-right: 5px solid #9CA3AF !important;
        }
        .dark .right-border-standard {
            border-right: 5px solid #6B7280 !important;
        }
    </style>
</head>
<body class="bg-pastel-bg text-pastel-text dark:bg-darkpastel-bg dark:text-darkpastel-text antialiased selection:bg-pastel-secondary selection:text-slate-800">

    <!-- Header / Barra de Título -->
    <header class="bg-pastel-header dark:bg-darkpastel-header shadow-sm border-b border-pastel-border dark:border-darkpastel-border px-2 py-1.5 flex items-center justify-between shrink-0 z-20">
        <div class="flex items-center gap-1.5 overflow-hidden">
            <div class="p-1 bg-white/70 dark:bg-slate-800/70 rounded-lg flex items-center justify-center shadow-xs shrink-0">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-[#5E3A8C] dark:text-[#CBB2EE]" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3zm5-3a1 1 0 0 0-2 0 3 3 0 0 1-6 0 1 1 0 0 0-2 0 5 5 0 0 0 4 4.9V19H9a1 1 0 1 0 0 2h6a1 1 0 1 0 0-2h-2v-3.1A5 5 0 0 0 17 11z"/>
                </svg>
            </div>
            <h1 class="text-base sm:text-lg font-bold tracking-tight text-[#4A2E6E] dark:text-[#E8DFF5] truncate">VoiceKar</h1>
        </div>

        <!-- Botões com espaçamento de 1px -->
        <div class="flex items-center gap-[1px]">
            <!-- Botão Adicionar Vídeo -->
            <button onclick="openModal('addModal')" title="Adicionar Vídeo" class="p-1.5 bg-pastel-primary hover:bg-pastel-primaryHover dark:bg-darkpastel-primary dark:hover:bg-darkpastel-primaryHover text-slate-800 dark:text-white rounded-md transition-colors shadow-xs">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
                </svg>
            </button>

            <!-- Botão Importar / Exportar -->
            <button onclick="openModal('ioModal')" title="Exportar / Importar JSON" class="p-1.5 bg-white/60 dark:bg-slate-800/60 hover:bg-white dark:hover:bg-slate-800 border border-pastel-border dark:border-darkpastel-border rounded-md text-slate-700 dark:text-slate-200 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4" />
                </svg>
            </button>

            <!-- Botão Tema -->
            <button onclick="toggleTheme()" id="themeBtn" title="Alternar Tema" class="p-1.5 bg-white/60 dark:bg-slate-800/60 hover:bg-white dark:hover:bg-slate-800 border border-pastel-border dark:border-darkpastel-border rounded-md text-slate-700 dark:text-slate-200 transition-colors">
                <svg id="themeIcon" xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                </svg>
            </button>

            <!-- Botão Ajuda -->
            <button onclick="openModal('helpModal')" title="Ajuda" class="p-1.5 bg-white/60 dark:bg-slate-800/60 hover:bg-white dark:hover:bg-slate-800 border border-pastel-border dark:border-darkpastel-border rounded-md text-slate-700 dark:text-slate-200 font-bold transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
            </button>

            <!-- Botão Status Assinante YouTube -->
            <button onclick="toggleYouTubeSubscriber()" id="subStatusBtn" title="Status de Assinante YouTube" class="p-1.5 bg-white/60 dark:bg-slate-800/60 hover:bg-white dark:hover:bg-slate-800 border border-pastel-border dark:border-darkpastel-border rounded-md text-slate-700 dark:text-slate-200 transition-colors flex items-center justify-center">
                <svg id="subIcon" xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
                </svg>
            </button>

            <!-- Switch Button -->
            <div class="flex items-center bg-white/60 dark:bg-slate-800/60 px-1.5 py-1 rounded-md border border-pastel-border dark:border-darkpastel-border">
                <label class="relative inline-flex items-center cursor-pointer">
                    <input type="checkbox" id="openModeSwitch" onchange="toggleOpenMode()" class="sr-only peer">
                    <div class="w-7 h-3.5 bg-gray-300 peer-focus:outline-none rounded-full peer dark:bg-gray-600 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-2.5 after:w-2.5 after:transition-all dark:peer-checked:bg-pastel-accent"></div>
                </label>
            </div>
        </div>
    </header>

    <!-- Layout Principal -->
    <div class="flex-1 flex flex-col md:flex-row overflow-hidden w-full">
        
        <!-- Menu Lateral -->
        <aside class="w-full md:w-[28%] lg:w-[30%] bg-pastel-card/50 dark:bg-darkpastel-card/50 border-r border-pastel-border dark:border-darkpastel-border flex flex-col h-[32vh] md:h-full overflow-hidden shrink-0">
            <div class="p-1.5 border-b border-pastel-border dark:border-darkpastel-border bg-pastel-card dark:bg-darkpastel-card shrink-0">
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-2 pointer-events-none text-gray-400">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                        </svg>
                    </span>
                    <input type="text" id="searchInput" oninput="renderMenuList()" placeholder="Buscar..." class="w-full pl-7 pr-2 py-1 text-xs rounded-md bg-pastel-bg dark:bg-darkpastel-bg border border-pastel-border dark:border-darkpastel-border focus:outline-none focus:ring-1 focus:ring-pastel-accent">
                </div>
            </div>
            <div class="flex-1 overflow-y-auto p-1.5 space-y-1" id="songList"></div>
        </aside>

        <!-- Área de Conteúdo -->
        <main class="flex-1 flex flex-col bg-pastel-bg dark:bg-darkpastel-bg p-2 overflow-hidden w-full" id="contentArea">
            <div id="welcomeMessage" class="flex-1 flex flex-col items-center justify-center text-center p-3 text-gray-500 dark:text-gray-400 space-y-2">
                <div class="p-2.5 bg-pastel-accent/20 dark:bg-darkpastel-accent/20 rounded-full">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-slate-600 dark:text-slate-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                </div>
                <h2 class="text-base font-semibold text-slate-800 dark:text-slate-200">Selecione uma música no menu</h2>
                <p class="max-w-md text-xs">Clique em um item da lista lateral para reproduzir.</p>
            </div>

            <div id="playerContainer" class="hidden flex-1 flex flex-col w-full h-full overflow-hidden space-y-1.5">
                <div class="bg-pastel-card dark:bg-darkpastel-card px-2.5 py-1.5 rounded-lg border border-pastel-border dark:border-darkpastel-border shadow-2xs flex items-center justify-between gap-2 shrink-0">
                    <div class="flex items-center gap-1.5 overflow-hidden">
                        <h2 id="playerTitle" class="text-xs sm:text-sm font-bold text-slate-800 dark:text-slate-100 truncate"></h2>
                        <span id="playbackBadge" class="text-[10px] px-1.5 py-0.5 rounded-full font-medium shrink-0"></span>
                        <span id="subscriberBadge" class="hidden text-[10px] px-1.5 py-0.5 rounded-full font-bold bg-amber-100 text-amber-800 dark:bg-amber-900/50 dark:text-amber-300 shrink-0">Premium</span>
                    </div>
                    <div class="flex items-center gap-1.5 shrink-0">
                        <a id="externalLinkBtn" href="#" target="_blank" title="Abrir no YouTube" class="p-1 text-slate-500 hover:text-slate-800 dark:hover:text-slate-200 rounded">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
                            </svg>
                        </a>
                        <button onclick="deleteCurrentSong()" title="Excluir" class="p-1 text-red-500 hover:bg-red-50 dark:hover:bg-red-900/20 rounded">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="flex-1 w-full h-full rounded-lg overflow-hidden shadow-md border border-pastel-border dark:border-darkpastel-border bg-black relative">
                    <iframe id="youtubeIframe" class="w-full h-full border-0 absolute inset-0" src="" title="YouTube Video Embed" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
                </div>
            </div>
        </main>
    </div>

    <!-- MODAL: Adicionar Vídeo -->
    <div id="addModal" class="fixed inset-0 bg-black/40 backdrop-blur-xs hidden items-center justify-center p-3 z-50">
        <div class="bg-pastel-card dark:bg-darkpastel-card rounded-2xl max-w-md w-full p-4 border border-pastel-border dark:border-darkpastel-border shadow-xl">
            <h3 class="text-sm font-bold text-slate-800 dark:text-slate-100 mb-2.5">Adicionar Novo Vídeo</h3>
            <form id="addForm" onsubmit="handleAddSong(event)" class="space-y-2.5">
                <div>
                    <label class="block text-[11px] font-semibold uppercase text-gray-500 mb-0.5">Nome do Cantor / Banda</label>
                    <input type="text" id="inputArtist" required placeholder="Ex: Adele" class="w-full px-2.5 py-1 rounded-lg bg-pastel-bg dark:bg-darkpastel-bg border border-pastel-border dark:border-darkpastel-border text-xs">
                </div>
                <div>
                    <label class="block text-[11px] font-semibold uppercase text-gray-500 mb-0.5">Nome da Música</label>
                    <input type="text" id="inputTitle" required placeholder="Ex: Set Fire To The Rain" class="w-full px-2.5 py-1 rounded-lg bg-pastel-bg dark:bg-darkpastel-bg border border-pastel-border dark:border-darkpastel-border text-xs">
                </div>
                <div>
                    <label class="block text-[11px] font-semibold uppercase text-gray-500 mb-0.5">Link do Vídeo</label>
                    <input type="text" id="inputUrl" required placeholder="https://www.youtube.com/watch?v=..." class="w-full px-2.5 py-1 rounded-lg bg-pastel-bg dark:bg-darkpastel-bg border border-pastel-border dark:border-darkpastel-border text-xs">
                </div>
                <div class="flex items-center gap-2 pt-0.5">
                    <input type="checkbox" id="inputOriginal" class="w-4 h-4 rounded text-pastel-primary border-gray-300">
                    <label for="inputOriginal" class="text-xs text-slate-700 dark:text-slate-300 font-medium">Playback Original?</label>
                </div>
                <div class="flex justify-end gap-2 pt-2">
                    <button type="button" onclick="closeModal('addModal')" class="px-3 py-1 text-xs rounded-lg bg-pastel-bg dark:bg-darkpastel-bg text-slate-700 dark:text-slate-300">Cancelar</button>
                    <button type="submit" class="px-3 py-1 text-xs rounded-lg bg-pastel-primary dark:bg-darkpastel-primary text-slate-800 dark:text-white font-medium">Salvar</button>

    <!-- MODAL: Editar Vídeo -->

            <form id="editForm" onsubmit="handleEditSong(event)" class="space-y-2.5">
                <div>
                    <label class="block text-[11px] font-semibold uppercase text-gray-500 mb-0.5">Nome do Cantor / Banda</label>
                    <input type="text" id="editArtist" required placeholder="Ex: Adele" class="w-full px-2.5 py-1 rounded-lg bg-pastel-bg dark:bg-darkpastel-bg border border-pastel-border dark:border-darkpastel-border text-xs">
                </div>
                <div>
                    <label class="block text-[11px] font-semibold uppercase text-gray-500 mb-0.5">Nome da Música</label>
                    <input type="text" id="editTitle" required placeholder="Ex: Set Fire To The Rain" class="w-full px-2.5 py-1 rounded-lg bg-pastel-bg dark:bg-darkpastel-bg border border-pastel-border dark:border-darkpastel-border text-xs">
                </div>
                <div>
                    <label class="block text-[11px] font-semibold uppercase text-gray-500 mb-0.5">Link do Vídeo</label>
                    <input type="text" id="editUrl" required placeholder="https://www.youtube.com/watch?v=..." class="w-full px-2.5 py-1 rounded-lg bg-pastel-bg dark:bg-darkpastel-bg border border-pastel-border dark:border-darkpastel-border text-xs">
                </div>
                <div class="flex items-center gap-2 pt-0.5">
                    <input type="checkbox" id="editOriginal" class="w-4 h-4 rounded text-pastel-primary border-gray-300">
                    <label for="editOriginal" class="text-xs text-slate-700 dark:text-slate-300 font-medium">Playback Original?</label>
                </div>
                <div class="flex justify-end gap-2 pt-2">
                    <button type="button" onclick="closeModal('editModal')" class="px-3 py-1 text-xs rounded-lg bg-pastel-bg dark:bg-darkpastel-bg text-slate-700 dark:text-slate-300">Cancelar</button>
                    <button type="submit" class="px-3 py-1 text-xs rounded-lg bg-pastel-primary dark:bg-darkpastel-primary text-slate-800 dark:text-white font-medium">Salvar</button>

    <!-- MODAL: Exportar / Importar JSON -->
    <div id="ioModal" class="fixed inset-0 bg-black/40 backdrop-blur-xs hidden items-center justify-center p-3 z-50">
        <div class="bg-pastel-card dark:bg-darkpastel-card rounded-2xl max-w-md w-full p-4 border border-pastel-border dark:border-darkpastel-border shadow-xl space-y-3">
            <h3 class="text-sm font-bold text-slate-800 dark:text-slate-100">Exportar / Importar JSON</h3>
            <div class="p-2.5 bg-pastel-bg dark:bg-darkpastel-bg rounded-xl border border-pastel-border dark:border-darkpastel-border">
                <button onclick="exportJSON()" class="w-full py-1.5 bg-pastel-accent/30 text-slate-800 dark:text-slate-100 font-medium text-xs rounded-lg">Baixar Arquivo JSON</button>
            </div>
            <div class="p-2.5 bg-pastel-bg dark:bg-darkpastel-bg rounded-xl border border-pastel-border dark:border-darkpastel-border">
                <input type="file" id="importFile" accept=".json" class="hidden" onchange="importJSON(event)">
                <button onclick="document.getElementById('importFile').click()" class="w-full py-1.5 bg-pastel-secondary/30 text-slate-800 dark:text-slate-100 font-medium text-xs rounded-lg">Carregar Arquivo JSON</button>
            </div>
            <div class="flex justify-end pt-1">
                <button onclick="closeModal('ioModal')" class="px-3 py-1 text-xs rounded-lg bg-pastel-bg dark:bg-darkpastel-bg text-slate-700">Fechar</button>
            </div>
        </div>
    </div>

    <!-- MODAL: Ajuda -->
    <div id="helpModal" class="fixed inset-0 bg-black/40 backdrop-blur-xs hidden items-center justify-center p-3 z-50">
        <div class="bg-pastel-card dark:bg-darkpastel-card rounded-2xl max-w-md w-full p-4 border border-pastel-border dark:border-darkpastel-border shadow-xl space-y-2.5 max-h-[90vh] overflow-y-auto">
            <div class="flex items-center justify-between gap-2">
                <h3 id="helpTitle" class="text-sm font-bold text-slate-800 dark:text-slate-100">Ajuda do VoiceKar</h3>
                <label class="flex items-center gap-1.5 cursor-pointer text-[11px] font-medium text-slate-600 dark:text-slate-300 shrink-0 select-none">
                    <input type="checkbox" id="helpLangSwitch" onchange="toggleHelpLang()" class="w-3.5 h-3.5 rounded text-pastel-primary border-gray-300">
                    <span id="helpLangLabel">Translate to English</span>
                </label>
            </div>
            <div id="helpContent" class="space-y-2 text-xs text-slate-600 dark:text-slate-300 leading-relaxed"></div>
            <div class="flex justify-end pt-1">
                <button id="helpCloseBtn" onclick="closeModal('helpModal')" class="px-3 py-1 text-xs rounded-lg bg-pastel-primary text-slate-800 font-medium">Fechar</button>
            </div>
        </div>
    </div>

    <script>
        const initialSongs = [
            { id: "1", artist: "4 Non Blondes", title: "Whats Up", url: "https://www.youtube.com/embed/6NXnxTNIWkc", isOriginal: true },
            { id: "2", artist: "Adele", title: "Set Fire To The Rain", url: "https://www.youtube.com/embed/a2giXO6eyuI", isOriginal: false }
        ];

        let songs = [];
        let selectedSongId = null;
        let editingSongId = null;
        let isDarkMode = false;
        let openInNewTab = false;
        let isYouTubeSubscriber = false;
        let helpLang = 'pt';

        window.onload = function() {
            loadTheme();
            loadOpenMode();
            loadSubscriberStatus();
            loadSongs();
            renderMenuList();
            renderHelp();
        };

        function loadSongs() {
            const stored = localStorage.getItem('voicekar_songs');
            songs = stored ? JSON.parse(stored) : [...initialSongs];
            sortSongs();
        }

        function saveSongs() {
            sortSongs();
            localStorage.setItem('voicekar_songs', JSON.stringify(songs));
            renderMenuList();
        }

        function sortSongs() {
            songs.sort((a, b) => {
                const nameA = `${a.artist} - ${a.title}`.toLowerCase();
                const nameB = `${b.artist} - ${b.title}`.toLowerCase();
                return nameA.localeCompare(nameB);
            });
        }

        function extractVideoId(input) {
            if (!input) return "";
            if (input.includes('<iframe')) {
                const match = input.match(/src=["']([^"']+)["']/);
                if (match && match[1]) input = match[1];
            }
            if (input.includes('youtube.com/embed/')) {
                return input.split('youtube.com/embed/')[1].split('?')[0].split('&')[0];
            } else if (input.includes('youtu.be/')) {
                return input.split('youtu.be/')[1].split('?')[0].split('&')[0];
            } else if (input.includes('youtube.com/watch')) {
                try { return new URLSearchParams(input.split('?')[1]).get("v") || ""; } catch(e) {}
            }
            return "";
        }

        function formatEmbedUrlWithAutoplay(input) {
            const videoId = extractVideoId(input);
            if (videoId) {
                // Parâmetros otimizados para ocultar marcas e respeitar status premium de assinante
                let extra = isYouTubeSubscriber ? "&iv_load_policy=3&modestbranding=1&controls=1" : "&controls=1";
                return `https://www.youtube.com/embed/${videoId}?autoplay=1&enablejsapi=1${extra}`;
            }
            return input.includes('autoplay=1') ? input : `${input}&autoplay=1`;
        }

        function getWatchUrl(input) {
            const videoId = extractVideoId(input);
            if (videoId) {
                return `https://www.youtube.com/watch?v=${videoId}&autoplay=1`;
            }
            return input.includes('autoplay=1') ? input : `${input}&autoplay=1`;
        }

        function renderMenuList() {
            const listEl = document.getElementById('songList');
            const query = document.getElementById('searchInput').value.toLowerCase();
            listEl.innerHTML = '';

            const filtered = songs.filter(s => s.artist.toLowerCase().includes(query) || s.title.toLowerCase().includes(query));
            if (filtered.length === 0) {
                listEl.innerHTML = `<p class="text-[11px] text-center text-gray-400 py-3">Sem registros.</p>`;
                return;
            }

            filtered.forEach(song => {
                const borderClass = song.isOriginal ? 'right-border-original' : 'right-border-standard';
                const isSelected = song.id === selectedSongId;
                const titleHtml = `<div class="font-bold text-xs text-slate-800 dark:text-slate-100 truncate">${escapeHtml(song.artist)}</div><div class="text-[10px] text-slate-500 truncate">${escapeHtml(song.title)}</div>`;

                const wrapper = document.createElement('div');
                wrapper.className = `rounded-lg bg-pastel-card dark:bg-darkpastel-card hover:bg-slate-50 dark:hover:bg-slate-800 flex items-center border border-pastel-border dark:border-darkpastel-border ${borderClass} ${(isSelected && !openInNewTab) ? 'ring-2 ring-pastel-accent' : ''}`;

                if (openInNewTab) {
                    // Área clicável como link nativo <a> para autoplay garantido em nova aba
                    const watchUrl = getWatchUrl(song.url);
                    const a = document.createElement('a');
                    a.href = watchUrl;
                    a.target = "_blank";
                    a.className = `flex-1 min-w-0 py-1.5 px-2 cursor-pointer no-underline`;
                    a.innerHTML = titleHtml;
                    wrapper.appendChild(a);
                } else {
                    // Área clicável normal para carregar no embed interno
                    const clickArea = document.createElement('div');
                    clickArea.className = `flex-1 min-w-0 py-1.5 px-2 cursor-pointer`;
                    clickArea.onclick = () => selectSong(song.id);
                    clickArea.innerHTML = titleHtml;
                    wrapper.appendChild(clickArea);
                }

                // Botão de edição (ícone de lápis)
                const editBtn = document.createElement('button');
                editBtn.title = 'Editar';
                editBtn.className = `shrink-0 p-1 mr-1 text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 rounded`;
                editBtn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" /></svg>`;
                editBtn.onclick = (ev) => { ev.preventDefault(); ev.stopPropagation(); openEditModal(song.id); };
                wrapper.appendChild(editBtn);

                listEl.appendChild(wrapper);
            });
        }

        function selectSong(id) {
            const song = songs.find(s => s.id === id);
            if (!song) return;
            selectedSongId = id;
            renderMenuList();

            if (!openInNewTab) {
                const embedUrl = formatEmbedUrlWithAutoplay(song.url);
                const watchUrl = getWatchUrl(song.url);

                document.getElementById('welcomeMessage').classList.add('hidden');
                document.getElementById('playerContainer').classList.remove('hidden');
                document.getElementById('playerTitle').innerText = `${song.artist} - ${song.title}`;
                document.getElementById('externalLinkBtn').href = watchUrl;
                
                const badge = document.getElementById('playbackBadge');
                badge.innerText = song.isOriginal ? 'Original' : 'Padrão';
                badge.className = song.isOriginal ? 'text-[10px] px-1.5 py-0.5 rounded-full font-bold bg-emerald-100 text-emerald-800' : 'text-[10px] px-1.5 py-0.5 rounded-full font-bold bg-gray-200 text-gray-700';

                const subBadge = document.getElementById('subscriberBadge');
                if (isYouTubeSubscriber) {
                    subBadge.classList.remove('hidden');
                } else {
                    subBadge.classList.add('hidden');
                }

                document.getElementById('youtubeIframe').src = embedUrl;
            }
        }

        function toggleYouTubeSubscriber() {
            isYouTubeSubscriber = !isYouTubeSubscriber;
            localStorage.setItem('voicekar_subscriber', isYouTubeSubscriber ? 'true' : 'false');
            updateSubscriberUI();
            if (selectedSongId && !openInNewTab) selectSong(selectedSongId);
        }

        function loadSubscriberStatus() {
            isYouTubeSubscriber = localStorage.getItem('voicekar_subscriber') === 'true';
            updateSubscriberUI();
        }

        function updateSubscriberUI() {
            const btn = document.getElementById('subStatusBtn');
            const icon = document.getElementById('subIcon');
            if (isYouTubeSubscriber) {
                btn.classList.add('bg-amber-100', 'dark:bg-amber-900/40', 'border-amber-300');
                icon.classList.remove('text-gray-400');
                icon.classList.add('text-amber-600', 'dark:text-amber-400');
            } else {
                btn.classList.remove('bg-amber-100', 'dark:bg-amber-900/40', 'border-amber-300');
                icon.classList.add('text-gray-400');
                icon.classList.remove('text-amber-600', 'dark:text-amber-400');
            }
        }

        function deleteCurrentSong() {
            if (!selectedSongId) return;
            songs = songs.filter(s => s.id !== selectedSongId);
            selectedSongId = null;
            saveSongs();
            document.getElementById('youtubeIframe').src = '';
            document.getElementById('playerContainer').classList.add('hidden');
            document.getElementById('welcomeMessage').classList.remove('hidden');
        }

        function handleAddSong(e) {
            e.preventDefault();
            const artist = document.getElementById('inputArtist').value.trim();
            const title = document.getElementById('inputTitle').value.trim();
            const rawUrl = document.getElementById('inputUrl').value.trim();
            const isOriginal = document.getElementById('inputOriginal').checked;
            if (!artist || !title || !rawUrl) return;

            const newSong = { id: Date.now().toString(), artist, title, url: formatEmbedUrlWithAutoplay(rawUrl), isOriginal };
            songs.push(newSong);
            saveSongs();
            document.getElementById('addForm').reset();
            closeModal('addModal');
            if (!openInNewTab) selectSong(newSong.id);
        }

        function openEditModal(id) {
            const song = songs.find(s => s.id === id);
            if (!song) return;
            editingSongId = id;
            document.getElementById('editArtist').value = song.artist;
            document.getElementById('editTitle').value = song.title;
            document.getElementById('editUrl').value = song.url;
            document.getElementById('editOriginal').checked = !!song.isOriginal;
            openModal('editModal');
        }

        function handleEditSong(e) {
            e.preventDefault();
            const song = songs.find(s => s.id === editingSongId);
            if (!song) return;
            const artist = document.getElementById('editArtist').value.trim();
            const title = document.getElementById('editTitle').value.trim();
            const rawUrl = document.getElementById('editUrl').value.trim();
            const isOriginal = document.getElementById('editOriginal').checked;
            if (!artist || !title || !rawUrl) return;
            song.artist = artist;
            song.title = title;
            song.url = formatEmbedUrlWithAutoplay(rawUrl);
            song.isOriginal = isOriginal;
            saveSongs();
            closeModal('editModal');
            if (selectedSongId === editingSongId && !openInNewTab) selectSong(editingSongId);
            editingSongId = null;
        }

        const helpTexts = {
            pt: {
                title: "Ajuda do VoiceKar",
                close: "Fechar",
                langLabel: "Translate to English",
                sections: [
                    { h: "Como Adicionar Itens ao Menu", p: "Clique no bot\u00e3o com o \u00edcone de adi\u00e7\u00e3o (+) na barra superior. Informe o cantor/banda, o nome da m\u00fasica e o link do v\u00eddeo (YouTube) e salve. O item \u00e9 inserido automaticamente em ordem alfab\u00e9tica no menu lateral." },
                    { h: "Como Editar Itens do Menu", p: "Cada item do menu possui um \u00edcone de l\u00e1pis \u270f\ufe0f \u00e0 direita. Clique nele para abrir a janela de edi\u00e7\u00e3o, altere o cantor/banda, o nome da m\u00fasica, o link ou o tipo de playback e salve. A lista \u00e9 reordenada automaticamente." },
                    { h: "Como Excluir Itens", p: "Selecione a m\u00fasica no menu para abrir o player e clique no \u00edcone de lixeira (vermelho) no topo da \u00e1rea de reprodu\u00e7\u00e3o para remover o item." },
                    { h: "Busca", p: "Use o campo 'Buscar...' no topo do menu lateral para filtrar itens pelo nome do cantor/banda ou da m\u00fasica em tempo real." },
                    { h: "Playback Original x Padr\u00e3o", p: "Ao adicionar ou editar, marque 'Playback Original?' para sinalizar a vers\u00e3o oficial. Itens originais exibem uma borda verde \u00e0 direita; os demais, uma borda cinza." },
                    { h: "Modo de Abertura (Switch)", p: "Desligado = abre o v\u00eddeo incorporado na \u00e1rea de conte\u00fado. Ligado = abre diretamente em nova aba do navegador com clique nativo (permitindo autoplay irrestrito)." },
                    { h: "Status de Assinante do YouTube", p: "O bot\u00e3o com \u00edcone de escudo alterna o modo assinante (Premium). Quando ativo, o player usa par\u00e2metros que reduzem marcas/sobreposi\u00e7\u00f5es e exibe o selo 'Premium'." },
                    { h: "Tema Claro / Escuro", p: "Use o bot\u00e3o de tema (lua/sol) para alternar entre os modos claro e escuro. Sua prefer\u00eancia fica salva no navegador." },
                    { h: "Exportar / Importar JSON", p: "Pelo bot\u00e3o de importar/exportar voc\u00ea pode baixar todo o seu acervo em um arquivo JSON (backup) ou carregar um arquivo JSON para restaurar/substituir a lista atual." },
                    { h: "Navegador Recomendado", p: "Este aplicativo funciona melhor no Google Chrome. Para a melhor experi\u00eancia de reprodu\u00e7\u00e3o e autoplay, recomendamos abri-lo no Google Chrome." }
                ]
            },
            en: {
                title: "VoiceKar Help",
                close: "Close",
                langLabel: "Traduzir para portugu\u00eas",
                sections: [
                    { h: "How to Add Items to the Menu", p: "Click the add (+) button in the top bar. Enter the singer/band, the song name and the video link (YouTube), then save. The item is automatically inserted in alphabetical order in the side menu." },
                    { h: "How to Edit Menu Items", p: "Each menu item has a pencil icon \u270f\ufe0f on the right. Click it to open the edit window, change the singer/band, song name, link or playback type and save. The list is reordered automatically." },
                    { h: "How to Delete Items", p: "Select the song in the menu to open the player and click the (red) trash icon at the top of the playback area to remove the item." },
                    { h: "Search", p: "Use the 'Search...' field at the top of the side menu to filter items by singer/band or song name in real time." },
                    { h: "Original vs Standard Playback", p: "When adding or editing, check 'Original Playback?' to mark the official version. Original items show a green border on the right; the others show a gray border." },
                    { h: "Open Mode (Switch)", p: "Off = opens the embedded video in the content area. On = opens directly in a new browser tab with a native click (allowing unrestricted autoplay)." },

                    { h: "Light / Dark Theme", p: "Use the theme button (moon/sun) to switch between light and dark modes. Your preference is saved in the browser." },
                    { h: "Export / Import JSON", p: "With the import/export button you can download your whole collection as a JSON file (backup) or load a JSON file to restore/replace the current list." },

                ]
            }
        };

        function renderHelp() {
            const t = helpTexts[helpLang];
            document.getElementById('helpTitle').innerText = t.title;
            document.getElementById('helpCloseBtn').innerText = t.close;
            document.getElementById('helpLangLabel').innerText = t.langLabel;
            document.getElementById('helpContent').innerHTML = t.sections.map(s =>
                `<div class="p-2 bg-pastel-bg dark:bg-darkpastel-bg rounded-lg"><strong class="text-slate-800 dark:text-slate-100">${s.h}</strong><p class="mt-0.5">${s.p}</p></div>`
            ).join('');
        }

        function toggleHelpLang() {
            helpLang = document.getElementById('helpLangSwitch').checked ? 'en' : 'pt';
            renderHelp();
        }

        function toggleOpenMode() {
            openInNewTab = document.getElementById('openModeSwitch').checked;
            localStorage.setItem('voicekar_openmode', openInNewTab ? 'tab' : 'content');
            renderMenuList();
        }

        function loadOpenMode() {
            openInNewTab = localStorage.getItem('voicekar_openmode') === 'tab';
            document.getElementById('openModeSwitch').checked = openInNewTab;
        }

        function toggleTheme() {
            isDarkMode = !isDarkMode;
            document.documentElement.classList.toggle('dark', isDarkMode);
            localStorage.setItem('voicekar_theme', isDarkMode ? 'dark' : 'light');
            updateThemeIcon();
        }

        function loadTheme() {
            isDarkMode = localStorage.getItem('voicekar_theme') === 'dark' || (!localStorage.getItem('voicekar_theme') && window.matchMedia('(prefers-color-scheme: dark)').matches);
            document.documentElement.classList.toggle('dark', isDarkMode);
            updateThemeIcon();
        }

        function updateThemeIcon() {
            document.getElementById('themeIcon').innerHTML = isDarkMode ? 
                `<path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />` : 
                `<path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />`;
        }

        function exportJSON() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(songs, null, 2));
            const dl = document.createElement('a');
            dl.setAttribute("href", dataStr);
            dl.setAttribute("download", `voicekar_backup.json`);
            document.body.appendChild(dl);
            dl.click();
            dl.remove();
        }

        function importJSON(event) {
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (Array.isArray(imported)) { songs = imported; saveSongs(); closeModal('ioModal'); }
                } catch (err) { alert("Erro ao ler JSON."); }
            };
            if (event.target.files[0]) reader.readAsText(event.target.files[0]);
        }

        function openModal(id) { document.getElementById(id).classList.remove('hidden'); document.getElementById(id).classList.add('flex'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); document.getElementById(id).classList.remove('flex'); }
        function escapeHtml(str) { return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;"); }
    </script>
</body>
</html>
